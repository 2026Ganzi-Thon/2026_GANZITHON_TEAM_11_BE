services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yangsenunbam
      MYSQL_USER: yangsenunbam
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for local development}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD for local development}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
