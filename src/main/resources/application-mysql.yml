spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yangsenunbam?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:yangsenunbam}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
    locations: classpath:db/migration/be2
    table: flyway_be2_history
    # BE1의 기존 테이블과 별개로 BE2 마이그레이션을 관리한다.
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  sql:
    init:
      # BE1 브랜치를 통합하면 해당 파트의 기존 schema.sql도 초기화한다.
      mode: always
      schema-locations: optional:classpath:schema.sql
