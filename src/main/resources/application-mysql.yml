spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yangsenunbam}
    username: ${DB_USERNAME:yangsenunbam}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    hikari:
      data-source-properties:
        sslMode: VERIFY_IDENTITY
        trustCertificateKeyStoreUrl: ${DB_TRUSTSTORE_URL}
        trustCertificateKeyStorePassword: ${DB_TRUSTSTORE_PASSWORD}
        trustCertificateKeyStoreType: PKCS12
        fallbackToSystemTrustStore: false
