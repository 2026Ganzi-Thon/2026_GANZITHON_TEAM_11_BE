spring:
  profiles:
    group:
      prod: mysql
  flyway:
    enabled: false
  application:
    name: yangsenunbam
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    datatype:
      datetime:
        write-dates-as-timestamps: false
