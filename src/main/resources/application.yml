spring:
  profiles:
    group:
      prod: mysql
  application:
    name: yangsenunbam
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    datatype:
      datetime:
        write-dates-as-timestamps: false

  flyway:
    enabled: false

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/yangsebam;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
app:
  auth:
    hmac-secret: ${AUTH_HMAC_SECRET:}

  legal:
    terms-version: ${LEGAL_TERMS_VERSION:}
    privacy-version: ${LEGAL_PRIVACY_VERSION:}
    terms-url: ${LEGAL_TERMS_URL:}
    privacy-url: ${LEGAL_PRIVACY_URL:}

  password-reset:
    url: ${RESET_URL:}
    sender: ${RESET_SENDER:}
  safety:
    endpoint: ${SAFETY_ENDPOINT:}
    service-token: ${SAFETY_SERVICE_TOKEN:}
